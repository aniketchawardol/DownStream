# GitHub disables scheduled workflows after 60 days without repository activity. An empty commit each month
# resets that clock so the data jobs keep running.
name: heartbeat
on:
  schedule: [{ cron: '0 0 1 * *' }]   # 1st of every month
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git commit --allow-empty -m "heartbeat"
          git push
