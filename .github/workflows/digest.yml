# Runs services/worker/jobs/digest.js once. Job logic is shared with the local Docker worker.
name: weekly digest
on:
  schedule: [{ cron: '30 2 * * 1' }]   # Monday 08:00 IST (cron is UTC)
  workflow_dispatch: {}
concurrency: { group: mail, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --omit=dev
      - run: node services/worker/run-once.js digest
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMTP_URL: ${{ secrets.SMTP_URL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
