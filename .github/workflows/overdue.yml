# Runs services/worker/jobs/overdue.js once. Job logic is shared with the local Docker worker.
name: overdue testing check
on:
  schedule: [{ cron: '30 1 * * *' }]   # daily 07:00 IST (cron is UTC)
  workflow_dispatch: {}
concurrency: { group: overdue, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --omit=dev
      - run: node services/worker/run-once.js overdue
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
