# Runs services/worker/jobs/wqmis-dashboard.js once. Job logic is shared with the local Docker worker.
name: wqmis national dashboard
on:
  schedule: [{ cron: '30 4 * * *' }]   # daily 10:00 IST (cron is UTC)
  workflow_dispatch: {}
concurrency: { group: wqmis, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --omit=dev
      - run: node services/worker/run-once.js wqmis-dashboard
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
