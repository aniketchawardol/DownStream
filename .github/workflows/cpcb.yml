# Runs services/worker/jobs/cpcb.js once. Job logic is shared with the local Docker worker.
name: cpcb ingest
on:
  schedule: [{ cron: '*/15 * * * *' }]   # every 15 minutes (cron is UTC)
  workflow_dispatch: {}
concurrency: { group: cpcb, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --omit=dev
      - run: node services/worker/run-once.js cpcb
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          CPCB_URL: ${{ secrets.CPCB_URL }}
