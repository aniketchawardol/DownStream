# Runs services/worker/jobs/bootstrap.js once. Job logic is shared with the local Docker worker.
name: bootstrap (fill an empty database)
on:
  workflow_dispatch: {}   # run once after the first deploy (and any time the data looks empty)
concurrency: { group: wqmis, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --omit=dev
      - run: node services/worker/run-once.js bootstrap
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          CPCB_URL: ${{ secrets.CPCB_URL }}
          WQMIS_STATES: ${{ secrets.WQMIS_STATES }}
          WQMIS_DISTRICTS: ${{ secrets.WQMIS_DISTRICTS }}
