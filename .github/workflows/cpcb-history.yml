# Runs services/worker/jobs/cpcb-history.js once: each station's daily history (min, mean, max since late
# 2021) from CPCB's year.json files. The first run fetches ~480 files (about 10 minutes); later runs refresh
# each station once every 25 days. Resumable, so a run cut short continues next time.
name: cpcb history (daily since 2021)
on:
  schedule: [{ cron: '0 22 1 * *' }]   # 1st of each month, 03:30 IST (cron is UTC)
  workflow_dispatch: {}
concurrency: { group: cpcb-history, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --omit=dev
      - run: node services/worker/run-once.js cpcb-history
        env:
          NODE_ENV: production
          JOB_TIME_BUDGET_MIN: '50'
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          CPCB_URL: ${{ secrets.CPCB_URL }}
