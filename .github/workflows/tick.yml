# Backup for the web service. The frequent jobs (mailer every minute, simulator, CPCB) run inside the Render
# web service (WEB_JOBS=true), because GitHub's scheduler drops frequent runs under load. This workflow only
# wakes the site if it fell asleep, then runs the mailer once in case anything is pending. The mailer takes a
# Postgres advisory lock, so it never overlaps the web service's own mailer.
name: tick (wake the site, fallback mailer)
on:
  schedule: [{ cron: '*/10 * * * *' }]
  workflow_dispatch: {}
concurrency: { group: tick, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # --max-time 90 waits out a cold start; a failure here must not stop the mailer, which talks to Postgres directly.
      - name: wake the site
        continue-on-error: true
        run: |
          curl -fsS --retry 2 --max-time 90 -o /dev/null -w 'keepalive %{http_code} in %{time_total}s\n' \
            "${PUBLIC_BASE_URL:-https://downstream-web.onrender.com}/api/health"
        env:
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --omit=dev

      - name: send anything pending
        run: node services/worker/run-once.js mailer
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMTP_URL: ${{ secrets.SMTP_URL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
