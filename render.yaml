# Free tier only: one web service and one Postgres. The web service also runs the frequent jobs (mailer every
# minute, simulator, CPCB) in-process; the long WQMIS crawls run on GitHub Actions. See docs/RENDER.md.
databases:
  - name: downstream-db
    plan: free
    region: singapore          # closest Render region to India; change if a different one benchmarks faster

services:
  - type: web
    name: downstream-web
    runtime: docker
    dockerfilePath: services/api/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: downstream-db, property: connectionString }
      - key: NODE_ENV
        value: production
      - key: PUBLIC_BASE_URL
        sync: false            # set to the Render-assigned URL after first deploy, e.g. https://downstream-web.onrender.com
      - key: EMAIL_DRIVER
        value: smtp
      - key: EMAIL_RELAY_URL
        sync: false            # the Apps Script web app URL (scripts/gmail-relay.gs). Render's free plan blocks SMTP ports
      - key: EMAIL_RELAY_SECRET
        sync: false            # the SECRET script property set in that Apps Script project
      - key: EMAIL_DELIVERY
        value: queue            # only applies without a relay: confirmations then wait for the GitHub Actions mailer
      - key: WEB_JOBS
        value: "true"           # mailer, simulator, CPCB and a self keepalive run inside the web service
      - key: SMTP_URL
        sync: false            # unused on Render (SMTP ports are blocked on the free plan); kept for a paid plan
      - key: EMAIL_FROM
        sync: false
      - key: CONTACT_EMAIL
        sync: false            # secrets can't live in an env group (Render ignores sync: false there)
      - fromGroup: shared-config

envVarGroups:
  - name: shared-config
    envVars:
      - key: MOCK_MODE
        value: "true"          # keep the simulation band, test point and /api/dev/simulate in the demo
      - key: MOCK_LAT
        value: "16.18"
      - key: MOCK_LNG
        value: "75.70"
      - key: WQMIS_STATES
        value: "15"
      - key: WQMIS_DISTRICTS
        value: "187"
      - key: RIVER_CRITERIA_CLASS
        value: "C"
